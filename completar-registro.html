<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Completando tu registro | Praxia</title>
<link rel="icon" type="image/png" href="./assets/praxia-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--primario:#2E7D32;--primario-claro:#7BC043;--ink:#1A1A1A;--gray:#7a7a7a;--line:#ececec;--err:#c62828;--ok:#2e7d32;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#F7F9F6;color:var(--ink);font-family:'Montserrat',Arial,sans-serif;font-weight:500;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  img.logo{height:32px;margin-bottom:26px;}
  .box{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.06);text-align:left;}
  .box h1{font-size:19px;margin-bottom:8px;text-align:center;}
  .box p.sub{color:var(--gray);font-size:13px;margin-bottom:22px;text-align:center;}
  label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;margin-top:14px;}
  input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;}
  input:focus{outline:none;border-color:var(--primario);}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:30px;background:var(--primario);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
  button:disabled{opacity:.6;}
  .msg{margin-top:14px;font-size:13px;text-align:center;}
  .msg.err{color:var(--err);}
  .consentimiento-box{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:18px;background:#FAFAFA;}
  .consentimiento-texto{font-size:11.5px;color:#555;line-height:1.6;max-height:180px;overflow-y:auto;margin-bottom:12px;white-space:pre-wrap;}
  .datos-fijos-box{border:1.5px solid #A8C99B;border-radius:12px;padding:14px 16px;margin-bottom:16px;background:#EAF5E8;}
  .datos-fijos-aviso{font-size:12px;color:var(--primario);font-weight:700;margin-bottom:8px;}
  .datos-fijos-fila{font-size:13px;}
  .consentimiento-check{display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:600;cursor:pointer;}
  .consentimiento-check input{width:auto;margin-top:2px;}
</style>
</head>
<body>

<img class="logo" src="./assets/praxia-logo-completo.png" alt="Praxia">

<div class="box" id="caja">
  <p style="text-align:center;">Un momento...</p>
</div>

<script>
const SUPABASE_URL = 'https://uxbpfyeahqpertamhdxt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xaaA4lYAQZjdcMFRhMGtuQ_fvIeJKv7';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(location.search);
const rolParam = params.get('rol');
const psicologoIdParam = params.get('p');
const claimIdParam = params.get('claim');
const caja = document.getElementById('caja');

async function iniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    caja.innerHTML = '<p>No se detectó sesión. <a href="./login.html">Vuelve a iniciar sesión</a>.</p>';
    return;
  }

  const uid = session.user.id;

  // Si ya existe su fila (no es la primera vez), lo mandamos directo a su panel.
  const { data: psiExistente } = await sb.from('psicologos').select('estado').eq('id', uid).maybeSingle();
  if(psiExistente){
    location.href = './panel-psicologo.html';
    return;
  }
  const { data: pacExistente } = await sb.from('pacientes').select('id').eq('auth_user_id', uid).maybeSingle();
  if(pacExistente){
    location.href = './panel-paciente.html';
    return;
  }

  // Primera vez: hay que crear su fila. El rol viene del botón que usó
  // para llegar aquí (registro de psicólogo o liga de invitación de paciente).
  const nombreGoogle = session.user.user_metadata?.full_name || session.user.user_metadata?.name || session.user.email;
  const correoGoogle = session.user.email;

  if(rolParam === 'psicologo'){
    pintarFormPsicologo(nombreGoogle);
  } else if(rolParam === 'paciente' && psicologoIdParam){
    await pintarFormPaciente(nombreGoogle, psicologoIdParam);
  } else {
    caja.innerHTML = `
      <h1>Falta un dato</h1>
      <p class="sub">No sabemos si te registras como psicólogo o llegaste por la liga de un psicólogo. Vuelve a intentarlo desde el botón correcto.</p>
      <button onclick="location.href='./login.html'">Volver</button>`;
  }
}

function pintarFormPsicologo(nombreSugerido){
  caja.innerHTML = `
    <h1>Ya casi, ${escapar(nombreSugerido.split(' ')[0])}</h1>
    <p class="sub">Confirma tu nombre para tu cuenta de psicólogo. Queda pendiente de aprobación.</p>
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" value="${escapar(nombreSugerido)}">
    <button id="btnConfirmar">Crear mi cuenta</button>
    <p class="msg" id="msg"></p>
  `;

  document.getElementById('btnConfirmar').addEventListener('click', async ()=>{
    const btn = document.getElementById('btnConfirmar');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = 'Creando...';

    const { data: { session } } = await sb.auth.getSession();
    const { error } = await sb.from('psicologos').insert({
      id: session.user.id,
      nombre: document.getElementById('nombre').value.trim(),
      correo: session.user.email,
      estado: 'pendiente'
    });

    if(error){
      msg.textContent = 'Error: ' + error.message;
      msg.className = 'msg err';
      btn.disabled = false;
      return;
    }

    caja.innerHTML = '<h1>Cuenta creada</h1><p class="sub">Queda pendiente de aprobación. Te avisamos por correo en cuanto esté activa.</p>';
  });
}

async function pintarFormPaciente(nombreSugerido, psicologoId){
  const { data: psi, error } = await sb.from('psicologos_publicos')
    .select('nombre').eq('id', psicologoId).maybeSingle();

  if(error || !psi){
    caja.innerHTML = '<h1>Liga no válida</h1><p class="sub">Pídele a tu psicólogo que te comparta la liga de nuevo.</p>';
    return;
  }

  let nombreFijo = null;
  if(claimIdParam){
    const { data: infoClaim } = await sb.rpc('info_publica_claim', { p_paciente_id: claimIdParam });
    const infoPaciente = Array.isArray(infoClaim) ? infoClaim[0] : infoClaim;
    if(infoPaciente && infoPaciente.nombre) nombreFijo = infoPaciente.nombre;
  }

  const TEXTO_BASE = 'AVISO DE PRIVACIDAD\n\nResponsable del tratamiento de tus datos: tu psicólogo/a tratante dentro de esta plataforma (identificado en tu perfil) es quien decide cómo se usa tu información clínica y es responsable de la relación de atención psicológica contigo. Praxia es la plataforma tecnológica que le permite administrar su consulta; actúa como encargado del tratamiento, no como responsable de tu atención clínica.\n\nDatos que se tratan: nombre, correo, teléfono, fecha de nacimiento, datos sociodemográficos que tú decidas compartir, y datos relacionados con tu salud (motivo de consulta, antecedentes, evaluaciones, notas de sesión, diagnóstico si lo hay, y medicación). Estos últimos son datos personales sensibles conforme a la Ley Federal de Protección de Datos Personales en Posesión de los Particulares, por tratarse de información de salud.\n\nPara qué se usan: exclusivamente para brindarte atención psicológica — agendar y dar seguimiento a tus sesiones, mantener tu expediente clínico, y facilitar la comunicación con tu psicólogo/a. Praxia no usa tu información con fines de mercadotecnia ni la vende ni la comparte con terceros para publicidad.\n\nCómo limitar el uso de tu información: puedes solicitar directamente a tu psicólogo/a que se restrinja cierta información dentro de tu expediente, dentro de lo que la práctica clínica permita.\n\nTransferencias: tus datos no se transfieren a terceros salvo lo estrictamente necesario para prestarte el servicio (por ejemplo, proveedores de videollamada o de infraestructura tecnológica que alojan la plataforma), o cuando la ley lo requiera.\n\nTus derechos (ARCO): tienes derecho a Acceder, Rectificar, Cancelar tus datos, y a Oponerte a su tratamiento. Puedes ejercerlos directamente con tu psicólogo/a, quien es tu contacto principal para estos temas.\n\nCambios a este aviso: si este aviso cambia de forma relevante, te lo notificaremos la próxima vez que inicies sesión.\n\nConsentimiento: por tratarse de datos de salud (datos sensibles), la ley requiere tu consentimiento expreso. Al aceptar y registrarte, otorgas ese consentimiento de forma expresa para los fines aquí descritos.';

  caja.innerHTML = `
    <h1>Ya casi, ${escapar((nombreFijo || nombreSugerido).split(' ')[0])}</h1>
    <p class="sub">Tu psicólogo: <strong>${escapar(psi.nombre)}</strong></p>
    ${nombreFijo
      ? `<div class="datos-fijos-box"><p class="datos-fijos-aviso">Tu psicólogo ya registró tu nombre.</p><div class="datos-fijos-fila"><strong>Nombre:</strong> ${escapar(nombreFijo)}</div></div>
         <input type="hidden" id="nombre" value="${escapar(nombreFijo)}">`
      : `<label for="nombre">Nombre completo</label>
         <input type="text" id="nombre" value="${escapar(nombreSugerido)}">`
    }

    <div class="consentimiento-box">
      <div class="consentimiento-texto">${escapar(TEXTO_BASE)}</div>
      <label class="consentimiento-check">
        <input type="checkbox" id="checkConsentimiento">
        <span>He leído y acepto lo anterior.</span>
      </label>
    </div>

    <button id="btnConfirmar">Crear mi cuenta</button>
    <p class="msg" id="msg"></p>
  `;

  document.getElementById('btnConfirmar').addEventListener('click', async ()=>{
    const btn = document.getElementById('btnConfirmar');
    const msg = document.getElementById('msg');

    if(!document.getElementById('checkConsentimiento').checked){
      msg.textContent = 'Necesitas aceptar el consentimiento para continuar.';
      msg.className = 'msg err';
      return;
    }

    btn.disabled = true;
    msg.textContent = 'Creando...';

    const { data: { session } } = await sb.auth.getSession();
    const nombre = document.getElementById('nombre').value.trim();
    let idExpediente;

    if(claimIdParam){
      const { data: infoClaim } = await sb.rpc('info_publica_claim', { p_paciente_id: claimIdParam });
      const infoPaciente = Array.isArray(infoClaim) ? infoClaim[0] : infoClaim;

      if(infoPaciente && infoPaciente.correo && infoPaciente.correo.toLowerCase() !== session.user.email.toLowerCase()){
        msg.textContent = `Tu psicólogo ya registró el correo ${infoPaciente.correo} para este expediente. Vuelve a intentarlo iniciando sesión con esa cuenta de Google, o pídele que actualice el correo.`;
        msg.className = 'msg err';
        btn.disabled = false;
        await sb.auth.signOut();
        return;
      }

      const { data: vinculo, error: errVinculo } = await sb.rpc('vincular_cuenta_paciente', { p_paciente_id: claimIdParam });
      const r = Array.isArray(vinculo) ? vinculo[0] : vinculo;

      if(errVinculo || !r || !r.ok){
        msg.textContent = 'Error al conectar con tu expediente: ' + (errVinculo?.message || r?.mensaje || 'error desconocido');
        msg.className = 'msg err';
        btn.disabled = false;
        return;
      }
      idExpediente = claimIdParam;
      if(!infoPaciente || !infoPaciente.correo){
        await sb.from('pacientes').update({ correo: session.user.email }).eq('id', claimIdParam);
      }
    } else {
      const { data: nuevoPaciente, error: errPerfil } = await sb.from('pacientes').insert({
        auth_user_id: session.user.id,
        nombre,
        correo: session.user.email,
        psicologo_id: psicologoId
      }).select('id').single();

      if(errPerfil){
        msg.textContent = 'Error: ' + errPerfil.message;
        msg.className = 'msg err';
        btn.disabled = false;
        return;
      }
      idExpediente = nuevoPaciente.id;
    }

    await sb.from('consentimientos').insert({
      paciente_id: idExpediente,
      psicologo_id: psicologoId,
      texto_aceptado: TEXTO_BASE,
      user_agent: navigator.userAgent
    });

    location.href = './panel-paciente.html';
  });
}

function escapar(t){
  const d = document.createElement('div');
  d.textContent = t == null ? '' : t;
  return d.innerHTML;
}

iniciar();
</script>

</body>
</html>
