<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Praxia</title>
<link rel="icon" type="image/png" href="./assets/praxia-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{--verde:#377534;--verde-suave:#5C9A59;--ink:#111111;--gray:#7a7a7a;--line:#ececec;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--ink);font-family:'Montserrat',Arial,sans-serif;font-weight:500;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  img{width:120px;margin-bottom:24px;}
  h1{font-size:30px;margin-bottom:8px;}
  p{color:var(--gray);font-size:14.5px;margin-bottom:32px;max-width:380px;line-height:1.6;}
  .botones{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  a.btn{padding:13px 26px;border-radius:30px;font-size:14px;font-weight:700;text-decoration:none;}
  a.primario{background:var(--verde);color:#fff;}
  a.primario:hover{background:var(--verde-suave);}
  a.secundario{border:1.5px solid var(--line);color:var(--ink);}
  a.secundario:hover{border-color:var(--verde);}
  .nota{margin-top:40px;font-size:11.5px;color:#bbb;}
</style>
</head>
<body>
  <img src="./assets/praxia-logo-completo.png" alt="Praxia">
  <h1>Praxia</h1>
  <p>El lugar donde llevas tu consultorio de terapia virtual: agenda, sesiones y expedientes en un solo lugar.</p>
  <div class="botones">
    <a class="btn primario" href="./login.html">Iniciar sesión</a>
    <a class="btn secundario" href="./registro-psicologo.html">Soy psicólogo</a>
  </div>
  <p class="nota">Versión de desarrollo — no indexada</p>
</body>
</html>
