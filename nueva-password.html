<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Nueva contraseña | Praxia</title>
<link rel="icon" type="image/png" href="./assets/praxia-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--primario:#2E7D32;--primario-claro:#7BC043;--primario-suave:#A8C99B;--bg:#F7F9F6;--ink:#1A1A1A;--gray:#7a7a7a;--line:#ececec;--err:#c62828;--ok:#2e7d32;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg,#F7F9F6);color:var(--ink);font-family:'Montserrat',Arial,sans-serif;font-weight:500;min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  header{display:flex;align-items:center;gap:10px;padding:24px 32px;border-bottom:1.5px solid var(--line);}
  header img{height:26px;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .box{width:100%;max-width:420px;}
  .box h1{font-size:26px;margin-bottom:8px;}
  .box p.sub{color:var(--gray);font-size:14px;margin-bottom:32px;}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;margin-top:18px;}
  input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;}
  input:focus{outline:none;border-color:var(--primario);}
  button{width:100%;margin-top:28px;padding:14px;border:none;border-radius:30px;background:var(--primario);color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;}
  button:hover{background:var(--primario-claro);}
  button:disabled{opacity:.6;cursor:default;}
  .ayuda{font-size:12px;color:var(--gray);margin-top:6px;font-weight:600;}
  .msg{margin-top:16px;font-size:13.5px;min-height:18px;}
  .msg.err{color:var(--err);}
  .msg.ok{color:var(--ok);}
  .foot{margin-top:24px;font-size:13px;color:var(--gray);text-align:center;}
  .foot a{color:var(--ink);font-weight:700;border-bottom:1.5px solid var(--primario);}
  .marca-pie{display:flex;justify-content:center;padding:24px 0 8px;opacity:.35;}
  .marca-pie img{height:18px;width:auto;}
</style>
<link rel="stylesheet" href="./assets/estilo.css">
</head>
<body>

<header>
  <a href="./index.html"><img src="./assets/praxia-logo-completo.png" alt="Praxia"></a>
</header>

<main>
  <div class="box" id="caja">
    <h1>Un momento</h1>
    <p class="sub">Estamos validando tu liga...</p>
  </div>
</main>
<div class="marca-pie"><img src="./assets/praxia-isotipo.png" alt="Praxia"></div>

<script>
const SUPABASE_URL = 'https://uxbpfyeahqpertamhdxt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xaaA4lYAQZjdcMFRhMGtuQ_fvIeJKv7';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const caja = document.getElementById('caja');
const MIN_LARGO = 8;

function escapar(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function pintarLigaInvalida(detalle){
  caja.innerHTML = `
    <h1>Liga no válida</h1>
    <p class="sub">${escapar(detalle)}</p>
    <p class="foot"><a href="./login.html">Volver a intentarlo</a></p>
  `;
}

function pintarFormulario(){
  caja.innerHTML = `
    <h1>Crea tu contraseña</h1>
    <p class="sub">Elige una contraseña nueva para entrar a Praxia.</p>

    <form id="formPassword">
      <label for="password">Contraseña nueva</label>
      <input type="password" id="password" autocomplete="new-password" required>
      <p class="ayuda">Mínimo ${MIN_LARGO} caracteres.</p>

      <label for="password2">Repite la contraseña</label>
      <input type="password" id="password2" autocomplete="new-password" required>

      <button type="submit" id="btnGuardar">Guardar y entrar</button>
      <p class="msg" id="msg"></p>
    </form>
  `;

  document.getElementById('formPassword').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    const msg = document.getElementById('msg');
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;

    if(p1.length < MIN_LARGO){
      msg.textContent = `La contraseña necesita al menos ${MIN_LARGO} caracteres.`;
      msg.className = 'msg err';
      return;
    }
    if(p1 !== p2){
      msg.textContent = 'Las dos contraseñas no coinciden.';
      msg.className = 'msg err';
      return;
    }

    btn.disabled = true;
    msg.textContent = 'Guardando...';
    msg.className = 'msg';

    const { error } = await sb.auth.updateUser({ password: p1 });

    if(error){
      msg.textContent = 'No se pudo guardar: ' + error.message;
      msg.className = 'msg err';
      btn.disabled = false;
      return;
    }

    msg.textContent = 'Listo. Entrando...';
    msg.className = 'msg ok';

    // La liga de recuperación ya dejó una sesión activa, así que se puede
    // mandar directo a su panel sin pedirle que vuelva a iniciar sesión.
    const { data: { user } } = await sb.auth.getUser();
    const { data: psicologo } = await sb.from('psicologos').select('estado').eq('id', user.id).maybeSingle();

    let destino = './login.html';
    if(psicologo){
      destino = psicologo.estado === 'aprobado' ? './panel-psicologo.html' : './login.html';
    } else {
      const { data: paciente } = await sb.from('pacientes').select('id').eq('auth_user_id', user.id).maybeSingle();
      if(paciente) destino = './panel-paciente.html';
    }

    setTimeout(()=>{ location.href = destino; }, 700);
  });
}

async function iniciar(){
  // Supabase manda el resultado en el fragmento de la URL. Si la liga ya
  // vencía o se usó antes, viene un error ahí en vez de los tokens.
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const errorHash = hash.get('error_description') || hash.get('error');
  if(errorHash){
    pintarLigaInvalida(errorHash.replace(/\+/g, ' ') + '. Las ligas caducan y solo sirven una vez; pide una nueva desde "¿Olvidaste tu contraseña?".');
    return;
  }

  // detectSessionInUrl procesa el fragmento de forma asíncrona, así que la
  // sesión puede no estar lista en el primer intento.
  let sesion = null;
  for(let intento = 0; intento < 10 && !sesion; intento++){
    const { data } = await sb.auth.getSession();
    sesion = data.session;
    if(!sesion) await new Promise(r => setTimeout(r, 150));
  }

  if(!sesion){
    pintarLigaInvalida('Esta liga ya no sirve o se abrió en un navegador distinto al que la pidió. Pide una nueva desde "¿Olvidaste tu contraseña?".');
    return;
  }

  pintarFormulario();
}

iniciar();
</script>

</body>
</html>
