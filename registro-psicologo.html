<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Registro de psicólogo | Praxia</title>
<link rel="icon" type="image/png" href="./assets/praxia-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--primario:#2E7D32;--primario-claro:#7BC043;--primario-suave:#A8C99B;--bg:#F7F9F6;--ink:#1A1A1A;--gray:#7a7a7a;--line:#ececec;--err:#c62828;--ok:#2e7d32;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg,#F7F9F6);color:var(--ink);font-family:'Montserrat',Arial,sans-serif;font-weight:500;min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  header{display:flex;align-items:center;gap:10px;padding:24px 32px;border-bottom:1.5px solid var(--line);}
  header img{height:26px;} header .logo-link{display:flex;align-items:center;gap:10px;}
  header span{font-weight:800;letter-spacing:2px;font-size:15px;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .box{width:100%;max-width:420px;}
  .box h1{font-size:26px;margin-bottom:8px;}
  .box p.sub{color:var(--gray);font-size:14px;margin-bottom:32px;}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;margin-top:18px;}
  input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;}
  input:focus{outline:none;border-color:var(--primario);}
  button{width:100%;margin-top:28px;padding:14px;border:none;border-radius:30px;background:var(--primario);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;}
  button:hover{background:var(--primario-claro);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:16px;font-size:13.5px;min-height:18px;}
  .msg.err{color:var(--err);}
  .msg.ok{color:var(--ok);}
  .foot{margin-top:24px;font-size:13px;color:var(--gray);text-align:center;}
  .separador{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--gray);font-size:12px;}
  .separador::before,.separador::after{content:"";flex:1;height:1px;background:var(--line);}
  .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border:1.5px solid var(--line);border-radius:30px;background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .btn-google:hover{border-color:var(--primario);}
  .opcional{color:var(--gray);font-weight:600;}
  .pista{font-size:11.5px;color:var(--gray);font-weight:600;margin-top:5px;line-height:1.5;}
  .foot a{color:var(--ink);font-weight:700;border-bottom:1.5px solid var(--primario);}

  .marca-pie{display:flex;justify-content:center;padding:24px 0 8px;opacity:.35;}
  .marca-pie img{height:18px;width:auto;}
</style>
</head>
<body>

<header>
  <a class="logo-link" href="./index.html">
    <img src="./assets/praxia-logo-completo.png" alt="Praxia">
  </a>
</header>

<main>
  <div class="box">
    <h1>Regístrate como psicólogo</h1>
    <p class="sub">Tu cuenta queda pendiente de aprobación antes de poder usarse. Te avisamos por correo en cuanto esté activa.</p>

    <form id="formRegistro">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required>

      <label for="correo">Correo</label>
      <input type="email" id="correo" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" minlength="8" required>

      <label for="codigo">Código de invitación <span class="opcional">(si tienes uno)</span></label>
      <input type="text" id="codigo" placeholder="Déjalo vacío si vas a contratar un plan" autocomplete="off">
      <p class="pista">Con código entras sin pagar. Sin código, eliges tu plan al entrar.</p>

      <button type="submit" id="btnRegistrar">Crear cuenta</button>
      <p class="msg" id="msg"></p>
    </form>

    <!-- Alta con Google oculta por ahora: el registro de psicologos va por
         correo y contraseña, para que cada alta pase por aprobacion.
         Se conserva el codigo para reactivarlo quitando el display:none. -->
    <div class="separador" style="display:none;"><span>o</span></div>
    <button class="btn-google" id="btnGoogle" style="display:none;">
      <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.2 0 9.9-1.7 13.6-4.7l-6.3-5.3c-2 1.5-4.7 2.5-7.3 2.5-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 40.5 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.3 4.4-4.2 5.9l6.3 5.3C41.4 36.4 45 30.8 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
      Continuar con Google
    </button>

    <p class="foot">¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a></p>
  </div>
</main>
<div class="marca-pie"><img src="./assets/praxia-isotipo.png" alt="Praxia"></div>

<script>
  const SUPABASE_URL = 'https://uxbpfyeahqpertamhdxt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xaaA4lYAQZjdcMFRhMGtuQ_fvIeJKv7';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('btnGoogle').addEventListener('click', async ()=>{
    await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: `${location.origin}${location.pathname.replace(/[^/]+$/,'')}completar-registro.html?rol=psicologo` }
    });
  });

  const form = document.getElementById('formRegistro');
  const btn = document.getElementById('btnRegistrar');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.textContent = 'Creando cuenta...';
    msg.className = 'msg';

    const nombre = document.getElementById('nombre').value.trim();
    const correo = document.getElementById('correo').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await sb.auth.signUp({
      email: correo,
      password: password
    });

    if (error) {
      msg.textContent = error.message.includes('already registered')
        ? 'Ese correo ya está registrado. Intenta iniciar sesión.'
        : 'Hubo un error: ' + error.message;
      msg.className = 'msg err';
      btn.disabled = false;
      return;
    }

    const { error: insertError } = await sb.from('psicologos').insert({
      id: data.user.id,
      nombre: nombre,
      correo: correo,
      estado: 'pendiente'
    });

    if (insertError) {
      msg.textContent = 'Tu cuenta se creó pero hubo un error al guardar tu perfil. Contáctanos.';
      msg.className = 'msg err';
      btn.disabled = false;
      return;
    }

    // El código no se puede canjear todavía: la función necesita una sesión
    // y, si el correo requiere confirmación, aún no la hay. Se guarda para
    // aplicarlo en cuanto entre al panel.
    const codigo = document.getElementById('codigo').value.trim();
    if(codigo){
      try{ sessionStorage.setItem('praxia_codigo', codigo); }catch(e){}
    }

    msg.textContent = codigo
      ? 'Cuenta creada. Tu código se aplicará al entrar. Queda pendiente de aprobación, te avisamos por correo.'
      : 'Cuenta creada. Queda pendiente de aprobación, te avisamos por correo.';
    msg.className = 'msg ok';
    form.reset();
    btn.disabled = false;
  });
</script>

</body>
</html>
